<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1&only - Player de Música</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/player.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Web Dev Guide</div>
            <div class="nav-links">
                <a href="index.html">Início</a>
                <a href="tecnologias.html">Tecnologias</a>
                <a href="fluxo.html">Fluxo</a>
                <a href="boas-praticas.html">Boas Práticas</a>
                <a href="quiz.html">Quiz</a>
                <a href="player.html" class="active">Player</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="album-container">
            <!-- Container do Álbum -->
            <div class="album-cover">
                <img src="https://place-hold.it/500x500/666/fff/000.png&text=1%26only&bold&fontsize=30" 
                     alt="Capa do álbum 1&only">
            </div>

            <!-- Informações da Música -->
            <div class="track-info">
                <div class="track-title">1&only</div>
                <div class="track-artist">Xlov</div>
            </div>

            <!-- Status de Reprodução -->
            <div class="play-status">Carregando...</div>

            <!-- Controles do Player -->
            <div class="player-controls">
                <button class="play-button" disabled>▶️</button>
            </div>

            <!-- Mensagem de fallback para navegadores sem suporte a áudio -->
            <noscript>
                <p style="color: red;">Seu navegador precisa ter JavaScript habilitado para reproduzir música.</p>
            </noscript>
        </div>
    </main>

    <script src="js/player.js"></script>
</body>
</html>
