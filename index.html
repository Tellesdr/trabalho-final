<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site de Músicas</title>
    <!-- Link para o arquivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header: Contém elementos do topo da página como título e navegação -->
    <header>
        <h1>Meu Site de Músicas</h1>
        <nav>
            <ul>
                <li><a href="#lista-de-musicas">Músicas</a></li>
                <!-- Outros itens de navegação podem ser adicionados aqui -->
            </ul>
        </nav>
    </header>

    <!-- Main: Contém o conteúdo principal da página -->
    <main>
        <!-- Esta div será preenchida dinamicamente com os cards de música pelo JavaScript -->
        <div id="lista-de-musicas">
            <!-- Cards de música serão inseridos aqui -->
        </div>
    </main>

    <!-- Footer: Contém informações do rodapé como direitos autorais -->
    <footer>
        <p>&copy; 2025 Meu Site de Músicas. Todos os direitos reservados.</p>
    </footer>

    <!-- Script JavaScript que controla a funcionalidade dinâmica do site -->
    <script src="app.js"></script>
</body>
</html>
