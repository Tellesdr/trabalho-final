<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Músicas - Meu Site</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/audio.css">
    <style>
        .albums-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .album-card {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .album-card:hover {
            transform: scale(1.05);
        }

        .album-cover {
            width: 180px;
            height: 180px;
            margin: 0 auto 15px;
            border-radius: 5px;
            overflow: hidden;
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .album-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .album-artist {
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Web Dev Guide</div>
            <div class="nav-links">
                <a href="index.html">Início</a>
                <a href="tecnologias.html">Tecnologias</a>
                <a href="fluxo.html">Fluxo</a>
                <a href="boas-praticas.html">Boas Práticas</a>
                <a href="quiz.html">Quiz</a>
                <a href="musicas.html" class="active">Músicas</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="albums-grid" id="albumsGrid">
            <!-- Os álbuns serão adicionados aqui via JavaScript -->
        </section>
    </main>

    <script src="js/audio.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Aqui você vai adicionar cada música com sua URL
            // Por exemplo:
            // audioController.addTrack('album1', 'URL_DA_MUSICA', 'Nome da Música', 'Nome do Artista');
            
            // Função para criar um card de álbum
            function createAlbumCard(id, title, artist, coverUrl) {
                const card = document.createElement('div');
                card.className = 'album-card';
                card.innerHTML = `
                    <div class="album-cover">
                        <img src="${coverUrl}" alt="${title}">
                    </div>
                    <div class="album-title">${title}</div>
                    <div class="album-artist">${artist}</div>
                `;
                card.onclick = () => audioController.playTrack(id);
                return card;
            }

            // Área onde você vai adicionar seus álbuns
            const albumsGrid = document.getElementById('albumsGrid');
            
            // Exemplo de como adicionar um álbum (você vai substituir com seus próprios álbuns):
            /*
            const albums = [
                { id: 'album1', title: 'Nome do Álbum', artist: 'Artista', cover: 'caminho/para/capa.jpg' }
            ];
            
            albums.forEach(album => {
                audioController.addTrack(album.id, 'URL_DA_MUSICA', album.title, album.artist);
                albumsGrid.appendChild(createAlbumCard(album.id, album.title, album.artist, album.cover));
            });
            */
        });
    </script>
</body>
</html>
